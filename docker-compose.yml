services:

  app:
    build: .
    container_name: node-app
    ports:
      - "3000:3000"
    environment:
      MONGO_URL: mongodb://mongodb:27017
    depends_on:
      - mongodb

  mongodb:
    image: mongo:8
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
